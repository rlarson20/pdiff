[project]
name = "pdiff"
version = "0.1.0"
description = "Step through the diffs between consecutive commits of a git branch"
readme = "README.md"
authors = [
    { name = "rlarson20", email = "richard.rj.larson@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
pdiff = "pdiff:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
